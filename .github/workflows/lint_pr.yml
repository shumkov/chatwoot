# ref: https://github.com/amannn/action-semantic-pull-request
# ensure PR title is in semantic format

name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # UMI fork: allow the `UMI:` patch-commit prefix alongside the conventional
          # types (see CONTRIBUTING-UMI.md). Keep the rest of the default set.
          types: |
            UMI
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
